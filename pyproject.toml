[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a2asecbench"
version = "0.1.0"
description = "A2ASecBench v0 benchmark harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "a2a-sdk[http-server]>=0.3.26,<1.0.0",
  "pyyaml>=6.0",
  "requests>=2.31.0",
  "httpx>=0.27.0",
  "fastapi>=0.110.0",
  "starlette<0.49.0",
  "sse-starlette<3.0",
  "uvicorn>=0.23.0",
  "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
include = ["attacks*", "harness*", "sut*", "utils*"]

[tool.setuptools.package-data]
attacks = ["fixtures/**/*.json", "legacy/cc_explicit/fixtures/**/*.json"]
